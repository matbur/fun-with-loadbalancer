# Example full load balancer configuration (step 11f).
# Run with:
#
#   go run ./cmd/lb -config examples/lb.yaml
#
# Every field is optional — omitted ones use their defaults.
# Explicitly set flags override file values ("flags > file > defaults").

# Address the load balancer listens on. Defaults to ":8080".
listen: ":8080"

# Backends — base addresses (scheme://host:port) the original request path is
# appended to. At least one backend is required (from the file or -backends).
backends:
  - http://localhost:9001
  - http://localhost:9002

# Backend selection algorithm.
#   round-robin            — in turn (default)
#   weighted-round-robin   — proportional to weights
#   least-connections      — backend with the fewest active requests
algorithm: weighted-round-robin

# Backend weights, in the same order as `backends`. Optional — without them
# every backend has weight 1. The number of weights must match the number of
# backends. Used by algorithm: weighted-round-robin.
weights: [2, 1]

# Health check: how often and with what timeout every backend is probed with
# GET /healthz. Defaults to 10s and 2s respectively.
health_check_every: 10s
health_check_timeout: 2s

# How many backends one health check cycle probes at once (0 = no cap). Probes
# run in parallel so a cycle costs about one timeout instead of
# len(backends) * timeout — a cycle slower than health_check_every would make the
# ticker drop ticks, and the real interval would become the cycle duration.
# The default 16 keeps a cycle under 10s for pools up to 80 backends; raise it
# for larger pools. The cap also bounds how much of the shared transport's
# connection budget health checks can take from proxied traffic.
health_check_parallelism: 16

# Per-backend circuit breaker (transport errors only, not backend HTTP codes).
breaker_threshold: 3   # consecutive transport errors that open the circuit; >= 1
breaker_cooldown: 5s   # how long the circuit stays open before a retry

# Structured logging (log/slog).
log_format: text       # text | json
log_level: info        # debug | info | warn | error

# Request limits (proxied traffic only; admin/metrics/health endpoints are exempt).
max_body_bytes: 1048576 # max request body size in bytes; 0 = unlimited
max_concurrent: 0       # max concurrent in-flight requests; 0 = unlimited

# HTTP server deadlines. Both default to 0, i.e. no deadline — the request
# limits above are size-based, and a body is bounded by max_body_bytes rather
# than by a clock. Read the body at your own risk: a client slow enough to hit
# read_timeout is cut off mid-transfer, and the resulting error is charged to
# the backend as a transport failure.
#
# Header and keep-alive lifetimes are not configurable: read_header_timeout is
# 5s and idle_timeout is 60s, which bound connection lifetime without touching
# request semantics.
read_timeout: 0s        # max duration for reading a whole request incl. body; 0 = no limit
write_timeout: 0s       # max duration for writing a response; 0 = no limit